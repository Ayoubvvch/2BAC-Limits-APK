name: Build & Release Dual Signed APKs (Lite & Full)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Determine Release Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              PATCH_NUM=$(( ${{ github.run_number }} - 11 ))
              if [ "$PATCH_NUM" -lt 0 ]; then PATCH_NUM=0; fi
              VERSION="1.2.${PATCH_NUM}"
            fi
          fi
          VERSION_CODE=$(( ${{ github.run_number }} + 4 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Core Unit Tests
        run: ./gradlew :core:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build Dual Signed Release APKs (Lite & Full)
        run: ./gradlew :app:assembleRelease :app-full:assembleRelease -PversionName="${{ steps.version.outputs.version }}" -PversionCode="${{ steps.version.outputs.version_code }}" --no-daemon --stacktrace

      - name: Verify Both APK Signatures (V1+V2+V3+V4)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          LITE_APK=$(find "app/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)
          if [ -z "$LITE_APK" ]; then
            echo "Error: Lite Release APK not found!"
            exit 1
          fi
          echo "=== Verifying Lite APK ($LITE_APK) ==="
          "$APKSIGNER" verify --verbose --print-certs "$LITE_APK"

          FULL_APK=$(find "app-full/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)
          if [ -z "$FULL_APK" ]; then
            echo "Error: Full Release APK not found!"
            exit 1
          fi
          echo "=== Verifying Full APK ($FULL_APK) ==="
          "$APKSIGNER" verify --verbose --print-certs "$FULL_APK"

      - name: Prepare APK Assets
        id: prepare_apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          LITE_APK=$(find "app/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)
          FULL_APK=$(find "app-full/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)

          LITE_TARGET="2BAC-Limits-Lite-v${VERSION}.apk"
          FULL_TARGET="2BAC-Limits-Full-v${VERSION}.apk"

          cp "$LITE_APK" "$LITE_TARGET"
          cp "$FULL_APK" "$FULL_TARGET"

          ls -lh "$LITE_TARGET" "$FULL_TARGET"

          echo "lite_path=$LITE_TARGET" >> "$GITHUB_OUTPUT"
          echo "full_path=$FULL_TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=${{ steps.version.outputs.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Dual Signed APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "2BAC Limits v${{ steps.prepare_apk.outputs.version }} (Lite & Full Dual Release)"
          body: |
            ### 2BAC Limits — Release v${{ steps.prepare_apk.outputs.version }}

            نقدم لكم الإصدار الثنائي الجديد لتطبيق **2BAC Limits** (مختبر النهايات اللانهائي) لطلاب السنة الثانية بكالوريا علوم تجريبية ورياضية بالمغرب، بنسختين رسميتين تلبيان كافة الاحتياجات:

            ---

            ### 🚀 1. النسخة الخفيفة — Lite Edition (`2BAC-Limits-Lite-v${{ steps.prepare_apk.outputs.version }}.apk`)
            * **الحجم**: خفيف جداً (~2.4 MB فقط).
            * **الإقلاع**: فوري ولحظي بدون أي تأخير عند التشغيل.
            * **المحرك أوفلاين**: محرك Kotlin CAS الداخلي المستقل للتوليد والتصحيح.
            * **المزامنة السحابية**: مزامنة كاملة وتلقائية مع سيرفر المنصة (`51.170.138.59`).
            * **الاستخدام المثالي**: الأجهزة ذات السعة التخزينية المحدودة، أو المراجعة السريعة أثناء الاتصال بالإنترنت.

            ---

            ### ⚡ 2. النسخة الكاملة — Full Edition (`2BAC-Limits-Full-v${{ steps.prepare_apk.outputs.version }}.apk`)
            * **الترسانة الكاملة**: محرك Python 3.11 مدمج أصلياً (عبر Chaquopy) مع مكتبة **SymPy 1.13+** ومكتبة **mpmath**.
            * **دقة رياضية 100% أوفلاين**: يحمل نفس محرك السيرفر بالكامل عبر **محورَي النهايات والمتتاليات (12 تقنية)**:
              - محور النهايات (8 تقنيات): `poly_factor`, `sqrt_conjugate`, `nth_root`, `add_sub_zero`, `trig`, **`ln_limits`**, **`exp_limits`**, `hybrid`.
              - محور المتتاليات العددية (4 تقنيات): **`seq_limits`**, **`seq_arith_geo`**, **`seq_fixed_point`**, **`seq_homographic`**.
            * **تصحيح رمزي مكافئ 100%**: يدعم القيم الثابتة والصيغ العامة بدلالة `n` (`expression_n`) بالبرهان الجبري الصارم.

            ---

            ### ✨ أبرز مستجدات الإصدار v${{ steps.prepare_apk.outputs.version }}:
            * **مؤقت تربوي حقيقي وبوابة انطلاق (Start Gate + Chrono + Pause-First)**: إخفاء التمرين قبل البدء، إيقاف المؤقت لفتح لوحة الإجابة، ووسام الطلاقة (`fast` / `good` / `slow`).
            * **قفل التركيز (Focus Lock)** وخارطة إتقان متدرجة بمراحل مفتوحة ومقفلة + مراجعات متباعدة وشارات المدرب التكيفي (Adaptive Coach).
            * **لوحة مفاتيح رياضية ذكية** تتكيّف مع المتتاليات (`n`, `^n`, `ln()`, `e^()`, `abs()`) ومعاينة KaTeX فورية.
            * **عرض رياضي متكامل** للنصوص المختلطة بصيغ `$ ... $` (Inline KaTeX Prose) مع **توقيع دائم موحد V1+V2+V3+V4** ومحدث OTA.
          files: |
            ${{ steps.prepare_apk.outputs.lite_path }}
            ${{ steps.prepare_apk.outputs.full_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
