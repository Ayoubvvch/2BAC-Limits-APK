name: Build & Release Signed APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Determine Release Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="1.0.${{ github.run_number }}"
            fi
          fi
          VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version }}" -PversionCode="${{ steps.version.outputs.version_code }}" --no-daemon --stacktrace

      - name: Verify APK V1+V2+V3+V4 Signature
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$OUTPUT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUTPUT_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$OUTPUT_DIR" -type f -name "*.apk" | head -n 1)
          TARGET_NAME="2BAC-Limits-v${VERSION}.apk"
          cp "$APK_FILE" "$TARGET_NAME"

          echo "apk_path=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=${{ steps.version.outputs.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "2BAC Limits v${{ steps.prepare_apk.outputs.version }}"
          body: |
            ### 2BAC Limits — Native Android Release (v${{ steps.prepare_apk.outputs.version }})

            - **100% Content & Design Fidelity**: Preserves the original `index.html`, `styles.css`, and `app.js` byte-for-byte in OLED Black Mode (`#000000`).
            - **Online-First Backend Sync + Offline CAS Engine**: Connects to the live FastAPI + SymPy backend (`http://51.170.138.59`) when online so existing usernames restore stats, mastery, history, and active exercises immediately, with seamless offline fallback to the deterministic Kotlin CAS engine across all 6 techniques (`poly_factor`, `sqrt_conjugate`, `nth_root`, `add_sub_zero`, `trig`, `hybrid`) and bundled offline KaTeX 0.16.11.
            - **Live Sync Status & Offline Cache (`StudentDatabase` + `ProgressSyncManager`)**: Accurate connectivity & `/api/health` reachability detection, tappable sync diagnostics/server URL dialog, SQLite v2 server cache, and queued event replay.
            - **Persistent V1+V2+V3+V4 Signing**: Signed with `app/keystore/release.jks` for seamless in-place OTA upgrades without uninstalling.
            - **Integrated In-App Updater**: Live download progress bar with `FileProvider` package installation and optional private-repo token support.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
